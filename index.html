<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --key: #232833;
    --key-hover: #2c3341;
    --op: #2f6fed;
    --op-hover: #3d7df7;
    --text: #eef1f6;
    --muted: #8b93a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2030, var(--bg));
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .calc {
    width: min(92vw, 360px);
    background: var(--panel);
    border: 1px solid #262b36;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .screen {
    text-align: right;
    padding: 14px 14px 18px;
    min-height: 92px;
  }
  .history {
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .display {
    font-size: 44px;
    font-weight: 600;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    background: var(--key);
    border: none;
    border-radius: 14px;
    padding: 16px 0;
    cursor: pointer;
    transition: background .12s ease, transform .05s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: var(--key-hover); }
  button:active { transform: scale(.97); }
  button.op { background: var(--op); }
  button.op:hover { background: var(--op-hover); }
  button.wide { grid-column: span 2; }
  button.fn { font-size: 16px; padding: 12px 0; color: var(--muted); }
  button.fn:hover { color: var(--text); }
</style>
</head>
<body>
  <main class="calc">
    <div class="screen">
      <div class="history" id="history"></div>
      <div class="display" id="display">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn" data-key="angle" id="angle" title="Toggle degrees / radians (D)">DEG</button>
      <button class="fn" data-key="sin" title="Sine (S)">sin</button>
      <button class="fn" data-key="cos" title="Cosine (O)">cos</button>
      <button class="fn" data-key="tan" title="Tangent (T)">tan</button>

      <button class="fn" data-key="sq" title="Square (Q)">x²</button>
      <button class="fn" data-key="sqrt" title="Square root (@)">√x</button>
      <button class="fn" data-key="^" title="Power (^ or Y)">xʸ</button>
      <button class="fn" data-key="root" title="y-th root (Shift+Y)">ʸ√x</button>

      <button class="fn" data-key="inv" title="Reciprocal (R)">1/x</button>
      <button class="fn" data-key="fact" title="Factorial (!)">n!</button>
      <button class="fn" data-key="ln" title="Natural log (N)">ln</button>
      <button class="fn" data-key="log" title="Log base 10 (L)">log</button>

      <button class="fn" data-key="pi" title="Pi (P)">π</button>
      <button class="fn" data-key="e" title="Euler's number (E)">e</button>
      <button class="fn wide" data-key="back" title="Backspace">⌫</button>

      <button data-key="clear">AC</button>
      <button data-key="negate">+/-</button>
      <button data-key="percent">%</button>
      <button class="op" data-key="/">÷</button>

      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="op" data-key="*">×</button>

      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button class="op" data-key="-">−</button>

      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="op" data-key="+">+</button>

      <button class="wide" data-key="0">0</button>
      <button data-key=".">.</button>
      <button class="op" data-key="=">=</button>
    </div>
  </main>
<script src="calc.js"></script>
<script>
(function () {
  "use strict";

  var state = Calc.initial();

  var display = document.getElementById("display");
  var history = document.getElementById("history");
  var angle = document.getElementById("angle");

  function render() {
    var text = state.current;
    // Group the integer part with thousands separators for readability.
    var negative = text.startsWith("-");
    var body = negative ? text.slice(1) : text;
    var parts = body.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    display.textContent = (negative ? "-" : "") + parts.join(".");
    history.textContent = state.history;
    angle.textContent = state.angle.toUpperCase();
  }

  function press(key) {
    state = Calc.press(state, key);
    render();
  }

  document.getElementById("keys").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (btn) press(btn.dataset.key);
  });

  var KEYMAP = {
    "+": "+", "-": "-", "*": "*", "x": "*", "/": "/",
    "=": "=", "Enter": "=",
    "Escape": "clear", "c": "clear",
    "%": "percent",
    "Backspace": "back",
    "^": "^", "y": "^", "Y": "root",
    "q": "sq", "@": "sqrt", "r": "inv", "!": "fact",
    "n": "ln", "l": "log",
    "s": "sin", "o": "cos", "t": "tan", "d": "angle",
    "p": "pi", "e": "e"
  };

  document.addEventListener("keydown", function (e) {
    // Leave browser shortcuts (Ctrl+R, Cmd+P, ...) alone.
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= "0" && e.key <= "9") { press(e.key); return; }
    if (e.key === "." || e.key === ",") { press("."); return; }
    var key = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()];
    if (key) { e.preventDefault(); press(key); }
  });

  render();
})();
</script>
</body>
</html>
